site_name: MAX-DIV - Maximum Diversity Solver.
site_url: https://max-div.readthedocs.io/
repo_url: https://github.com/bertpl/max-div
repo_name: bertpl/max-div
site_dir: ./reports/docs

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - navigation.sections
    - toc.integrate

hooks:
  - scripts/mkdocs_hooks.py

# The generated fragments are pulled in by snippet from outside docs/, which `mkdocs serve` does
# not watch on its own — without this, regenerating them leaves the served pages showing the
# previous render until something inside docs/ happens to change.
watch:
  - generated

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # These options specifically help with complex signatures
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 80
            show_source: false
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_submodules: false
            show_root_heading: true
            show_root_full_path: false
            show_if_no_docstring: false  # Hide undocumented members

            # Filter members to exclude private/internal
            filters:
              - "!^_"          # Exclude private members (starting with _)
              - "^__init__$"   # But keep __init__ methods
              - "!^__[^_]"     # Exclude protected (double underscore, but not dunder)
              - "!_internal$"  # Exclude functions ending with _internal, which are purely internal


markdown_extensions:
  - toc:
      toc_depth: 1  # Only show h1 (#) headers
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

