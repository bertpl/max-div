site_name: MAX-DIV - Maximum Diversity Solver.
site_url: https://yourusername.github.io/your-repo-name/
repo_url: https://github.com/bertpl/max-div
repo_name: bertpl/max-div
site_dir: ./reports/docs

extra_css:
  - stylesheets/extra.css

theme:
  name: readthedocs
  navigation_depth: 4
  collapse_navigation: false
  titles_only: false
  sticky_navigation: true
  includehidden: true
  prev_next_buttons_location: both

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [max_div]
          options:
            # Show documentation from docstrings
            docstring_style: sphinx  # or numpy, or google
            show_source: false
            show_root_heading: true
            show_root_full_path: false

            # Filter members to exclude private/internal
            filters:
              - "!^_"          # Exclude private members (starting with _)
              - "^__init__$"   # But keep __init__ methods
              - "!^__[^_]"     # Exclude protected (double underscore, but not dunder)
              - "!_internal$"  # Exclude functions ending with _internal, which are purely internal

            # Member options
            members_order: source  # or alphabetical
            show_if_no_docstring: false  # Hide undocumented members

            # Show type annotations
            show_signature_annotations: true
            separate_signature: true
  - mkdocs-autoapi:
      autoapi_dir: ./max_div
      autoapi_ignore:
        - "**/internal/**"
        - "**/_*.py"
      autoapi_file_patterns: ['*.py']
      autoapi_add_nav_entry: Reference
      autoapi_root: ./docs/reference

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - CLI: cli.md
  - Benchmarks: benchmarks/*.md
