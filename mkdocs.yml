site_name: MAX-DIV - Maximum Diversity Solver.
site_url: https://yourusername.github.io/your-repo-name/
repo_url: https://github.com/bertpl/max-div
repo_name: bertpl/max-div

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [max_div]
          options:
            # Show documentation from docstrings
            docstring_style: sphinx  # or numpy, or google
            show_source: false
            show_root_heading: true
            show_root_full_path: false

            # Filter members to exclude private/internal
            filters:
              - "!^_"          # Exclude private members (starting with _)
              - "^__init__$"   # But keep __init__ methods
              - "!^__[^_]"     # Exclude protected (double underscore, but not dunder)
              - "!_numba$"     # Exclude functions ending with _numba, which are optimized flavors of existing functions
              - "!_internal$"  # Exclude functions ending with _internal, which are purely internal

            # Member options
            members_order: source  # or alphabetical
            show_if_no_docstring: false  # Hide undocumented members

            # Show type annotations
            show_signature_annotations: true
            separate_signature: true
  - mkdocs-autoapi:
      autoapi_dir: ./max_div
      autoapi_ignore:
        - "**/internal/**"
      autoapi_file_patterns: ['*.py']
      autoapi_add_nav_entry: Reference
      autoapi_root: ./docs/reference

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Benchmarks: benchmarks.md
