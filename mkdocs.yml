site_name: MAX-DIV - Maximum Diversity Solver.
site_url: https://yourusername.github.io/your-repo-name/
repo_url: https://github.com/bertpl/max-div
repo_name: bertpl/max-div
site_dir: ./reports/docs

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - navigation.expand
    - navigation.sections
    - toc.integrate

plugins:
  - include-markdown
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [max_div]
          options:
            # These options specifically help with complex signatures
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 80
            show_source: false
            members_order: source
            docstring_style: sphinx  # or numpy, or google
            merge_init_into_class: true
            show_submodules: false
            show_root_heading: true
            show_root_full_path: false
            show_if_no_docstring: false  # Hide undocumented members

            # Filter members to exclude private/internal
            filters:
              - "!^_"          # Exclude private members (starting with _)
              - "^__init__$"   # But keep __init__ methods
              - "!^__[^_]"     # Exclude protected (double underscore, but not dunder)
              - "!_internal$"  # Exclude functions ending with _internal, which are purely internal

  - mkdocs-autoapi:
      autoapi_dir: ./max_div
      autoapi_ignore:
        - "**/internal/**"
        - "**/_*/**"        # Exclude all directories starting with _ and their contents
        - "**/_*.py"        # Exclude files starting with _
      autoapi_file_patterns: ['*.py']
      autoapi_add_nav_entry: Reference
      autoapi_root: ./docs/reference

markdown_extensions:
  - toc:
      toc_depth: 1  # Only show h1 (#) headers
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Documentation:
    - CLI: cli.md
    - Benchmark Results:
      - Overview: benchmarks/_index.md
      - Solver: benchmarks/solver/_index.md
      - Internal: benchmarks/internal/_index.md
  - About:
    - Roadmap: roadmap.md
    - Change Log: changelog.md
