site_name: MAX-DIV - Maximum Diversity Solver.
site_url: https://max-div.readthedocs.io/
repo_url: https://github.com/bertpl/max-div
repo_name: bertpl/max-div
site_dir: ./reports/docs

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - navigation.sections
    - toc.integrate

hooks:
  - scripts/mkdocs_hooks.py

# The generated fragments are pulled in by snippet from outside docs/, which `mkdocs serve` does
# not watch on its own — without this, regenerating them leaves the served pages showing the
# previous render until something inside docs/ happens to change.
watch:
  - generated

# The head-to-head results are snippet fragments pulled into the tier pages. Built as pages of their
# own they would land in site search, and their image links, written for the including page, would
# not resolve.
exclude_docs: |
  benchmarks/third_party/head_to_head/results/

plugins:
  - search
  # Old URLs of the pages folded into Benchmarks → 3rd Party Solvers keep working;
  # the README and external sites deep-link into them.
  - redirects:
      redirect_maps:
        comparison.md: benchmarks/third_party/comparison.md
        benchmarks/comparison/overview.md: benchmarks/third_party/head_to_head/overview.md
        benchmarks/comparison/tier1.md: benchmarks/third_party/head_to_head/tier1.md
        benchmarks/comparison/tier2.md: benchmarks/third_party/head_to_head/tier2.md
        benchmarks/comparison/tier3.md: benchmarks/third_party/head_to_head/tier3.md
        solvers/index.md: benchmarks/third_party/solvers/index.md
        solvers/max-div.md: benchmarks/third_party/solvers/max-div.md
        solvers/ortools-cpsat.md: benchmarks/third_party/solvers/ortools-cpsat.md
        solvers/scip.md: benchmarks/third_party/solvers/scip.md
        solvers/highs.md: benchmarks/third_party/solvers/highs.md
        solvers/rdkit.md: benchmarks/third_party/solvers/rdkit.md
        solvers/fpsample.md: benchmarks/third_party/solvers/fpsample.md
        solvers/skmatter.md: benchmarks/third_party/solvers/skmatter.md
        solvers/apricot-select.md: benchmarks/third_party/solvers/apricot-select.md
        solvers/qc-selector.md: benchmarks/third_party/solvers/qc-selector.md
        solvers/dppy.md: benchmarks/third_party/solvers/dppy.md
        solvers/kmedoids.md: benchmarks/third_party/solvers/kmedoids.md
        concepts/feasibility.md: concepts/constraints.md
        solvers/code-fdm.md: benchmarks/third_party/solvers/code-fdm.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # These options specifically help with complex signatures
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 80
            show_source: false
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_submodules: false
            show_root_heading: true
            show_root_full_path: false
            show_if_no_docstring: false  # Hide undocumented members

            # Filter members to exclude private/internal
            filters:
              - "!^_"          # Exclude private members (starting with _)
              - "^__init__$"   # But keep __init__ methods
              - "!^__[^_]"     # Exclude protected (double underscore, but not dunder)
              - "!_internal$"  # Exclude functions ending with _internal, which are purely internal


markdown_extensions:
  - toc:
      toc_depth: 1  # Only show h1 (#) headers
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Getting Started: getting_started.md
