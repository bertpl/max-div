[project]
name = "max-div"
version = "0.21.4"
description = "Configurable Solver for Maximum Diversity Problems with Fairness Constraints."
# readme is dynamic: hatch-fancy-pypi-readme builds the PyPI long-description from README.md,
# rewriting the relative splash link to a tag-pinned absolute URL (config below).
dynamic = ["readme"]
authors = [
    { name = "Bert Pluymers" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Per-Python minimum versions: each is the earliest release shipping a wheel for that CPython,
    # so `lowest-direct` CI jobs install wheels instead of attempting source builds.
    "numpy>=2.0.0; python_version == '3.12'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.3.2; python_version == '3.14'",
    "numpy>=2.5.2; python_version >= '3.15'",
    "scipy>=1.10.0; python_version == '3.12'",
    "scipy>=1.14.1; python_version == '3.13'",
    "scipy>=1.16.1; python_version == '3.14'",
    "scipy>=1.18.1; python_version >= '3.15'",
    "numba>=0.59; python_version == '3.12'",
    "numba>=0.61; python_version == '3.13'",
    "numba>=0.63; python_version == '3.14'",
    "numba>=0.68; python_version >= '3.15'",
    "click>=8.2.0",
    "tqdm>=4.66.0",
    "icc-rt; platform_machine == 'x86_64' and platform_system == 'Linux'",
    "intel-cmplr-lib-rt; platform_machine == 'x86_64' and platform_system == 'Linux'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    # Python versions kept in sync with .python-versions (`make release` checks this)
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    # Free-threaded builds are supported and CI-tested. Deliberately NOT mirrored in
    # .python-versions: no trove classifier exists for a free-threaded interpreter, and
    # `make release` validates that file against the numeric version classifiers above.
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The plot extra enables the plotting features (`max_div._core.plotting`); `import max_div` works
# without the extra, and reaching the plotting package without the extra raises an error naming the extra.
plot = [
    # Per-Python minimum versions, same rationale as the runtime dependencies above: each is the earliest
    # release shipping a wheel for that CPython, so the `lowest-direct` jobs install a wheel.
    "matplotlib>=3.8; python_version == '3.12'",
    "matplotlib>=3.9.2; python_version == '3.13'",
    "matplotlib>=3.10.6; python_version == '3.14'",
    "matplotlib>=3.11.2; python_version >= '3.15'",
]

[dependency-groups]
# Comparison-benchmark harness (see benchmarks/README.md); never part of the published package.
benchmarks = [
    "matplotlib>=3.9",
    "psutil>=5.9",       # machine-level memory measurement in the solver-scaling runner
    "fpsample>=1.0",
    "skmatter>=0.3",
    "rdkit>=2025.3",
    "apricot-select>=0.6",
    "kmedoids>=0.5",
    "networkx>=3.0",       # runtime dependency of the code-FDM research code
    "scikit-learn>=1.4",   # runtime dependency of the code-FDM research code
    "ortools>=9.10",       # CP-SAT: exact max-min reference
    "pyscipopt>=5.0",      # SCIP: exact mean/geomean-of-NN reference
    "highspy>=1.7",        # HiGHS: exact big-M max-min MIP reference
    "dppy>=0.3",           # k-DPP sampler: diverse-subset draws over an RBF kernel
    "qc-selector>=0.1",
]
# Split by activity, so what each one needs is a stated fact rather than a shared pile: the test
# matrix installs no linters, and a test reaching for a lint-only or docs-only package fails as the
# category error it is.
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5.0",
]
# The pre-commit config drives ruff and ty as local `uv run` hooks rather than pinned pre-commit
# environments, so both tools — and the stubs ty needs to check scipy usage — belong here. The
# extras are not listed: `make lint` and the ty hook install them with --all-extras, so ty sees the
# code behind every extra without a second copy of its minimum versions.
lint = [
    "pre-commit>=4.0",
    "ruff>=0.14.0",
    "scipy-stubs>=1.10.0",
    "ty>=0.0.58",  # pre-1.0 type checker — minimum version only; uv.lock pins the version actually used
]
package = [
    "check-wheel-contents>=0.6.2",
]
# This group holds the dependencies of the maintainer tooling under scripts/. The `test` group does
# not include the `tooling` group, because the package tests import no script; `make test-scripts`
# installs both groups for the tests of the scripts.
tooling = [
    "pyyaml>=6.0.3",
]
# Union only — never add a requirement here directly. `dev` is what a developer syncs and what the
# dependency audit exports, and it stays a derived fact so it cannot disagree with the groups above.
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "package" },
    { include-group = "tooling" },
]
# Docs toolchain, in its own dependency-group so it stays out of the package's PyPI metadata; out of
# dev like notebooks below. Read the Docs installs it with uv (see .readthedocs.yaml).
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autoapi[python]>=0.4.1",
    "mkdocs-include-markdown-plugin>=7.2.0",
    "mkdocs-redirects>=1.2.0",
    "ruff>=0.14.0",
]
# notebook/analysis tooling — not needed to run the test suite, so kept out of the
# dev group that CI installs (and out of the lowest-direct resolution surface)
notebooks = [
    "jupyter>=1.1.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.3.0",
    "cvxpy[ECOS,OSQP]>=1.7.1",
]

[project.scripts]
max-div = "max_div._core._cli._cli:cli"

[project.urls]
Documentation = "https://max-div.readthedocs.io/"
Source = "https://github.com/bertpl/max-div"
ChangeLog = "https://github.com/bertpl/max-div/blob/main/CHANGELOG.md"
Issues = "https://github.com/bertpl/max-div/issues"
Roadmap = "https://github.com/bertpl/max-div/milestones"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# The hero table needs a `<picture>` to switch on the reader's color scheme, and its paths live in
# attributes -- including `srcset`. PyPI's sanitizer drops `<picture>`/`<source>` and keeps the
# `<img>`, so PyPI shows the light variant, which is right for a page with no dark mode -- but only
# if that URL is absolute. The splash image needs no rule here: `make release` stamps it with an
# absolute tag-pinned URL directly in README.md.
pattern = '(src|srcset)="(docs/images/[^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/bertpl/max-div/v$HFPR_VERSION/\2"'

[tool.hatch.build.targets.sdist]
only-include = ["src/max_div"]

[tool.hatch.build.targets.wheel]
packages = ["src/max_div"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Broad rule set; PLC/PLR (pylint conventions/refactors) are deliberately excluded as
# noisy on this numerical domain, and specific carve-outs live in `ignore` below.
select = [
    "F",       # pyflakes
    "E", "W",  # pycodestyle (incl. E501 line-too-long)
    "I",       # isort
    "UP",      # pyupgrade
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "RET",     # flake8-return
    "PTH",     # flake8-use-pathlib
    "TC",      # flake8-type-checking
    "RUF",     # ruff-native
    "PLE", "PLW",  # pylint errors + warnings (PLC/PLR excluded — noisy on this domain)
    "PGH",     # pygrep-hooks: no blanket `noqa` / `type: ignore`
    "BLE",     # flake8-blind-except
    "A",       # flake8-builtins: shadowing
    "RSE",     # flake8-raise: no needless parens on `raise`
    "FLY",     # flynt: static str-join → f-string
    "INP",     # flake8-no-pep420: every package dir has an __init__.py
    "SLF",     # flake8-self: private-member access
    "S",       # flake8-bandit: security lint
    "D",       # pydocstyle (Google convention)
    "ANN",     # flake8-annotations
    "SIM",     # flake8-simplify
    "B",       # flake8-bugbear
    "N",       # pep8-naming
    "PT",      # flake8-pytest-style
    "C901",    # mccabe complexity gate (threshold in [tool.ruff.lint.mccabe])
    "TID251",  # banned imports: matplotlib only inside the plotting package (see banned-api below)
]
ignore = [
    "B905",    # numba nopython mode can't take zip()'s strict= kwarg
    "E731",    # assigning a lambda to a name is fine here; a trivial thunk reads better than a def
    "RET505",  # an explicit else after an if-return chain reads as the final case of a dispatch; no-else-return is not house preference
    "SIM108",  # an if/else block reads better than a conditional expression when a branch does work, which this rule cannot tell
]

# matplotlib is the `plot` extra: only `max_div._core.plotting` may import it, so `import max_div` never
# needs it and the error for a missing extra lives in that one package. Everything outside the
# shipped package (tests, benchmarks, scripts, docs figures) is exempt in the per-file ignores.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"matplotlib".msg = "matplotlib is the optional `plot` extra: import it only inside max_div._core.plotting"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"                     # names given as a single "a, b" string
raises-require-match-for = ["Exception", "BaseException"]  # only the truly broad base exceptions need match=

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "S101", "S311", "D", "ANN", "TID251"]  # AAA tests: asserts, private access, random data, no docstring/annotation duty; may import matplotlib
"src/max_div/_core/plotting/**" = ["TID251"]  # the one package that may import matplotlib (its __init__ guards the extra)
"benchmarks/**" = ["TID251"]  # harness, never part of the published package
"local/**" = ["TID251"]  # docs figures, never part of the published package
"benchmarks/tests/**" = ["SLF001", "S101", "S311", "D", "ANN"]  # harness tests: same carve-outs as the package suite
"tests/_core/_markdown/test_table.py" = ["E501"]  # expected-output literals: exact rendered table rows
"__init__.py" = ["F401"]                 # re-export modules: naked imports, no `as` alias
"scripts/**" = ["INP001", "S", "D", "ANN", "TID251"]  # maintainer tooling, not the shipped library
"scripts/tests/**" = ["SLF001"]  # The tests call the scripts' private functions, so this entry adds SLF001 to the scripts/** ignores.
".github/scripts/**" = ["INP001", "S", "D", "ANN"]   # maintainer tooling, not held to shipped-source style
# benchmark closures are constructed and invoked within the same loop iteration, so late binding never bites
"src/max_div/_core/_cli/benchmarks/internal/**" = ["B023"]
# problem-ID / benchmark-ID class-name suffixes (C1..C4, U1..U4, _Initialization, ...) are deliberate
"src/max_div/_core/benchmark_problems/_problems/**" = ["N801"]
"src/max_div/_core/_cli/benchmarks/solver_strategies/**" = ["N801"]
# calibration tooling & tests import the currently-committed constants under working-variable aliases
"src/max_div/_core/_math/fast_pow/_calibration.py" = ["N811"]
"tests/_core/_math/fast_log_exp/test_calibration.py" = ["N811"]
"tests/_core/_math/fast_pow/test_calibration.py" = ["N811"]

[tool.ty.src]
include = ["src/max_div"]

[tool.codespell]
# "intoto": the in-toto attestation format (provenance.intoto.jsonl).
# "sais": surname of a cited author (Lakhdar Sais).
ignore-words-list = "intoto,sais"

[tool.coverage.run]
source_pkgs = ["max_div"]
relative_files = true

[tool.coverage.report]
precision = 2
fail_under = 98
exclude_also = [
    "@abstractmethod",
    "@abc.abstractmethod",
    # numba compile-time hooks: their bodies run while numba compiles a caller, which never
    # happens on the coverage run, since that run disables compilation to see inside njit code
    "@intrinsic",
    "@overload",
    "@typeof_impl.register",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"

# The table below defines the CI test matrix of .github/workflows/_unit_tests.yml, and
# scripts/ci_test_matrix.py builds the jobs from it: the baseline runs on every Python in
# .python-versions, and each variant overrides some of the baseline's settings on a selection of
# Pythons. The settings other than runner are the inputs of .github/actions/unit_test.
#
# Every job runs on Linux, because the package is Python, numpy, scipy and numba with no code that
# depends on the OS.
#
# Every job runs on ARM, which runs this suite about twice as fast as x64 for
# the same work; the matrix does not set out to test CPU architectures.
[tool.ci-test-matrix]
baseline = { runner = "ubuntu-24.04-arm", resolution = "highest", jit = "on", extras = "true", coverage = "false" }
variants = [
    # The runtime dependencies declare separate minimum versions for each Python, so every Python
    # gets a lowest-direct job.
    { pythons = "all", resolution = "lowest-direct" },
    # Installing from uv.lock on the default Python gives the Python and numba versions that the
    # JIT golden master (the expected output of seeded, JIT-compiled solves) recorded, so this job
    # runs the JIT golden master test (tests/_core/solver/test_golden_master.py).
    { pythons = "default", resolution = "locked", env = { MAX_DIV_JIT_GOLDEN_MASTER = "1" } },
    # Coverage can trace the lines inside numba-compiled functions only with JIT compilation off.
    { pythons = "oldest+default", jit = "off", coverage = "true" },
    # These jobs test the plain install that a user gets: they skip the tests that need an extra,
    # and run the tests of the package's behavior without the extras installed.
    #
    # They run with JIT compilation on, because the extras and JIT settings do not interact: on
    # every job, a test that patches the check for installed extras covers the code path for a
    # missing extra.
    { pythons = "oldest+default", extras = "false" },
    # This variant selects the Pythons for which numba ships a free-threaded wheel; as of numba 0.68,
    # 3.15 has none.
    #
    # These jobs install the newest dependency versions only (the baseline's `highest`
    # resolution): the minimum numba versions predate numba's first free-threaded wheels, in 0.65,
    # so a `lowest-direct` job would build numba from source. No PEP 508 marker can raise the
    # minimum numba versions for free-threaded builds alone.
    { pythons = ["3.14"], is_free_threaded = true },
]
