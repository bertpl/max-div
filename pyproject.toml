[project]
name = "max-div"
version = "0.7.0"
description = "Configurable Solver for Maximum Diversity Problems with Fairness Constraints."
# readme is dynamic: hatch-fancy-pypi-readme builds the PyPI long-description from README.md,
# rewriting the relative splash link to a tag-pinned absolute URL (config below).
dynamic = ["readme"]
authors = [
    { name = "Bert Pluymers", email = "bert.pluymers@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # Per-Python floors: each is the earliest release shipping a wheel for that CPython,
    # so `lowest-direct` CI legs install wheels instead of attempting source builds.
    "numpy>=2.0.0; python_version < '3.13'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "scipy>=1.10.0; python_version < '3.13'",
    "scipy>=1.14.1; python_version == '3.13'",
    "scipy>=1.16.1; python_version >= '3.14'",
    "numba>=0.57; python_version < '3.12'",
    "numba>=0.59; python_version == '3.12'",
    "numba>=0.61; python_version == '3.13'",
    "numba>=0.63; python_version >= '3.14'",
    "click>=8.2.0",
    "tqdm>=4.66.0",
    "icc-rt; platform_machine == 'x86_64' and platform_system == 'Linux'",
    "intel-cmplr-lib-rt; platform_machine == 'x86_64' and platform_system == 'Linux'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    # Python versions kept in sync with .python-versions (release.py enforces this)
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autoapi[python]>=0.4.1",
    "mkdocs-include-markdown-plugin>=7.2.0",
    "ruff>=0.14.0",
]

[dependency-groups]
dev = [
    "check-wheel-contents>=0.6.2",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.14.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=14.0",
    "scipy-stubs>=1.10.0",
    "ty==0.0.58",  # pre-1.0 type checker — pin exactly; its ruleset is still evolving
]
# notebook/analysis tooling — not needed to run the test suite, so kept out of the
# dev group that CI installs (and out of the lowest-direct resolution surface)
notebooks = [
    "jupyter>=1.1.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.3.0",
    "cvxpy[ECOS,OSQP]>=1.7.1",
]

[project.scripts]
max-div = "max_div._core._cli._cli:cli"

[project.urls]
Documentation = "https://max-div.readthedocs.io/"
Source = "https://github.com/bertpl/max-div"
ChangeLog = "https://github.com/bertpl/max-div/blob/main/CHANGELOG.md"
Issues = "https://github.com/bertpl/max-div/issues"
Roadmap = "https://github.com/bertpl/max-div/milestones"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# splash image: relative link -> tag-pinned raw URL so each release's PyPI page
# renders that release's stamped splash, not whatever main's is at view time.
pattern = 'src="(images/[^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/bertpl/max-div/v$HFPR_VERSION/\1"'

[tool.hatch.build.targets.sdist]
only-include = ["src/max_div"]

[tool.hatch.build.targets.wheel]
packages = ["src/max_div"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Broad rule set; PLC/PLR (pylint conventions/refactors) are deliberately excluded as
# noisy on this numerical domain, and specific carve-outs live in `ignore` below.
select = [
    "F",       # pyflakes
    "E", "W",  # pycodestyle (incl. E501 line-too-long)
    "I",       # isort
    "UP",      # pyupgrade
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "RET",     # flake8-return
    "PTH",     # flake8-use-pathlib
    "TC",      # flake8-type-checking
    "RUF",     # ruff-native
    "PLE", "PLW",  # pylint errors + warnings (PLC/PLR excluded — noisy on this domain)
    "PGH",     # pygrep-hooks: no blanket `noqa` / `type: ignore`
    "BLE",     # flake8-blind-except
    "A",       # flake8-builtins: shadowing
    "RSE",     # flake8-raise: no needless parens on `raise`
    "FLY",     # flynt: static str-join → f-string
    "INP",     # flake8-no-pep420: every package dir has an __init__.py
    "SLF",     # flake8-self: private-member access
    "S",       # flake8-bandit: security lint
    "D",       # pydocstyle (Google convention)
    "ANN",     # flake8-annotations
    "SIM",     # flake8-simplify
    "B",       # flake8-bugbear
    "N",       # pep8-naming
    "PT",      # flake8-pytest-style
    "C901",    # mccabe complexity gate (threshold in [tool.ruff.lint.mccabe])
]
ignore = [
    "B905",    # numba nopython mode can't take zip()'s strict= kwarg
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"                     # names given as a single "a, b" string
raises-require-match-for = ["Exception", "BaseException"]  # only the truly broad base exceptions need match=

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "S101", "S311", "D", "ANN"]  # AAA tests: asserts, private access, random data, no docstring/annotation duty
"tests/_core/_markdown/test_table.py" = ["E501"]  # expected-output literals: exact rendered table rows
"__init__.py" = ["F401"]                 # re-export modules: naked imports, no `as` alias
"scripts/**" = ["INP001", "S", "D", "ANN"]           # maintainer tooling, not the shipped library
".github/scripts/**" = ["INP001", "S", "D", "ANN"]   # maintainer tooling, not held to shipped-source style
# benchmark closures are constructed and invoked within the same loop iteration, so late binding never bites
"src/max_div/_core/_cli/bm_internal/**" = ["B023"]
# problem-ID / benchmark-ID class-name suffixes (C1..C4, U1..U4, _Initialization, ...) are deliberate
"src/max_div/_core/benchmark_problems/_problems/**" = ["N801"]
"src/max_div/_core/_cli/bm_solver_strategies/**" = ["N801"]
# calibration tooling & tests import the currently-committed constants under working-variable aliases
"src/max_div/_core/_math/fast_pow/_calibration.py" = ["N811"]
"tests/_core/_math/fast_log_exp/test_calibration.py" = ["N811"]
"tests/_core/_math/fast_pow/test_calibration.py" = ["N811"]

[tool.ty.src]
include = ["src/max_div"]

[tool.codespell]
# "intoto": the in-toto attestation format (provenance.intoto.jsonl).
ignore-words-list = "intoto"

[tool.coverage.run]
source_pkgs = ["max_div"]
relative_files = true

[tool.coverage.report]
precision = 2
fail_under = 98
exclude_also = [
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal --reruns 10"
