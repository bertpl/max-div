# Solver registry — the ROWS of the capability grid, in the order they render.
#
# Categories render top to bottom in the order given here, and the tools within each category
# in the order listed. This file is the authority on both.
#
# `subject: true` marks the package everything else is being compared against, which every surface
# highlights. It is declared rather than inferred from position: "the first row of the first
# category" happens to be true today, but it is an ordering coincidence, and a renderer keying off
# it would silently highlight the wrong tool the moment a category is reordered.
#
# `key` is the record's file stem in the records directory (`RECORDS_DIR` in scripts/capability_data.py). Every entry must have a record and every
# record must have an entry — scripts/capability_data.py fails on either mismatch.
#
# `profile: false` keeps a tool out of the per-solver profiles while keeping its row in both
# tables. Only max-div uses it: it needs a record so the tables can describe it, but a section
# surveying third-party tools should not carry a profile of the package those tools are being
# compared against.
#
# `hero_name` is the short name for the README table, whose name gutter is a fixed-width column in
# a dense grid. Where a tool is named for both the solver and the Python binding that installs it,
# the reference tables carry the full name and the hero carries the solver's.

categories:
  - key: anytime
    label: Anytime optimizers
    tools:
      - key: max-div
        name: max-div
        subject: true
        profile: false

  - key: exact
    label: Exact solvers
    tools:
      - key: ortools-cpsat
        name: OR-Tools CP-SAT
      - key: scip
        name: SCIP (PySCIPOpt)
        hero_name: SCIP
      - key: highs
        name: HiGHS

  - key: oneshot
    label: One-shot pickers
    tools:
      - key: rdkit
        name: RDKit MaxMinPicker
      - key: fpsample
        name: fpsample
      - key: skmatter
        name: skmatter
      - key: apricot-select
        name: apricot-select
      - key: qc-selector
        name: qc-selector
      - key: code-fdm
        name: code-FDM

  # Tools whose answer is a diverse-looking subset by a different contract: cluster centers, or a
  # draw from a distribution. Measured as references under the dispersion metrics, never as
  # competitors on them.
  - key: clustering-sampling
    label: Clustering & sampling
    tools:
      - key: kmedoids
        name: kmedoids
      - key: dppy
        name: DPPy
