# Capability axes — the COLUMNS of the capability grid.
#
# The rows live in solver_registry.yaml; the cells live in each tool's record under
# docs/solvers/. Every record must carry exactly one cell per axis declared here, and may
# carry no others; scripts/capability_data.py enforces both directions.
#
# `hero: true` means the axis appears in the README hero table as well as on the comparison
# page. Every axis is hero-visible today — the flag exists so the comparison page can grow an
# axis the hero does not show, without either surface being redesigned.
#
# `hero_label` is the rotated single-column header in the SVG, so it stays short. `label` is
# what the comparison page and the per-solver feature tables use, where there is room. Groups
# carry the same pair for the same reason: the hero writes a group's name on a band spanning only
# its own columns, so "objective" fits where "diversity objectives" would run into its neighbor.

# The mark vocabulary, shared by every surface that renders a cell — including the hero SVG, whose
# renderer reads its glyphs and its legend wording from here.
#
# `hero_glyph` records where a surface deliberately draws a mark differently, so the difference is
# a stated fact rather than a drift. All three marks use it:
#
# `full` is the heavy check mark in the docs, where it is the one mark drawn at full ink and has to
# carry a column on its own — the light check does not hold that weight beside a half-disc. Raising
# the font weight cannot substitute: the glyph falls back to a face with no bolder cut, so 900
# renders identically to 700. The hero keeps the light check it shipped with.
#
# `partial` is a half-filled circle in the docs, where it sits beside a footnote marker and has to
# stay distinct from it at a glance. The hero draws a tilde instead: it has no footnotes to compete
# with, and the tilde matches the one that prefixes every practical-scale figure there.
#
# `none` is drawn as nothing at all in the hero, because in a dense grid an empty cell
# unambiguously reads as absence. A per-solver table has one row per capability and no such
# context, so a blank there reads as "we forgot" rather than "not supported" — hence a dash.
marks:
  full:
    glyph: "✔"
    hero_glyph: "✓"
    legend: built in
  partial:
    glyph: "◐"
    hero_glyph: "~"
    legend: reachable, but you supply the model, transform or metric
  none:
    glyph: "—"
    hero_glyph: ""
    legend: not available

# Metadata fields — the per-tool facts that are not capability marks. They render as a second table
# on each solver's page and as the comparison page's companion table; the hero SVG shows none of
# them, which is the whole reason they are declared apart from the axes above.
#
# `kind` tells the renderer how to read the value: `release_version` and `release_date` each take
# one half of a record's version/date pair, `url` becomes a link, and anything else is prose. A key
# is looked up in the record's `metadata:` block first and then at the top level, so a tool's source
# and verification date stay where they belong.
#
# The release is one record field shown as two columns, because a version and a date are read for
# different reasons — "how current is this" and "how alive is this" — and a single cell holding both
# answers neither cleanly. `note: false` keeps the field's note against the date alone: the notes
# here explain a stale or absent release, which is a question the date raises and the version does
# not, and repeating one note in adjacent cells says nothing the first one did not.
#
# `comparison: false` keeps a field off the comparison page while keeping it on the solver's own
# page — the counterpart of `hero:` on the axes below. Only the source URL uses it: eleven upstream
# links would dominate a table read across tools, and the comparison page reaches each tool's
# source through the link on its name.
metadata:
  - {key: guarantee, label: Guarantee}
  - {key: license, label: License}
  - {key: last_release, label: Version, kind: release_version, note: false}
  - {key: last_release, label: Released, kind: release_date}
  - {key: determinism, label: Determinism}
  - {key: input, label: Input}
  - {key: source, label: Source, kind: url, comparison: false}
  - {key: verified, label: Last verified}

groups:
  - key: distance
    hero_label: distance
    label: distance metrics
    axes:
      - key: l1
        hero_label: L1
        label: L1 (Manhattan) distance
        hero: true
      - key: l2
        hero_label: L2
        label: L2 (Euclidean) distance
        hero: true
      - key: linf
        hero_label: Linf
        label: Linf (Chebyshev) distance
        hero: true
      - key: cosine
        hero_label: cosine
        label: cosine distance
        hero: true
      - key: custom
        hero_label: custom
        label: caller-supplied distances
        hero: true

  - key: objective
    hero_label: objective
    label: diversity objectives
    axes:
      - key: max_min
        hero_label: max-min
        label: maximize the minimum separation
        hero: true
      - key: mean_nn
        hero_label: mean-of-NN
        label: maximize the mean nearest-neighbor separation
        hero: true
      - key: geomean_nn
        hero_label: geomean-of-NN
        label: maximize the geometric-mean nearest-neighbor separation
        hero: true
      - key: max_sum
        hero_label: max-sum
        label: maximize the mean pairwise distance
        hero: true

  - key: constraints
    hero_label: constraints
    label: constraints beyond k
    axes:
      - key: disjoint_groups
        hero_label: disjoint groups
        label: per-group counts over disjoint groups
        hero: true
      - key: overlapping_groups
        hero_label: overlapping groups
        label: per-group counts over overlapping groups
        hero: true
      - key: ranged_counts
        hero_label: ranged counts
        label: minimum and maximum counts per group
        hero: true

  - key: budget
    hero_label: budget
    label: time budget
    axes:
      - key: iterations
        hero_label: iterations
        label: budget expressed as an iteration count
        hero: true
      - key: wall_clock
        hero_label: wall clock
        label: budget expressed as wall-clock time
        hero: true
      - key: improves
        hero_label: improves with budget
        label: the answer improves when given more budget
        hero: true

# The scale column is not a mark: its value is a power of ten (or a range of them), and every
# record must explain the value it claims. It renders as the last column of the hero table and
# as a row of each per-solver feature table.
scale:
  key: max_practical_n
  hero_label: max practical n
  label: largest practical problem size
  hero: true
