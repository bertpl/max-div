version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" scans .github/workflows; each composite action under .github/actions
    # needs its own entry for the `uses:` pins inside it to be tracked.
    directories:
      - "/"
      - "/.github/actions/unit_test"
      - "/.github/actions/pre_commit"
    # Deliberately a different day from the uv entry below: both ecosystems used to
    # fire in the same minute, and since patch/minor bumps auto-merge, whichever
    # landed first left its sibling behind main — unmergeable under the
    # up-to-date-branch rule until someone updated the branch by hand.
    # Local overnight time (Dependabot applies the timezone incl. DST), so a PR
    # opens and merges while nothing else is being pushed to main. Treat it as a
    # preference, not a guarantee: observed firing times have varied by hours and
    # have landed off the nominal day, so the day separation above is what the
    # collision fix actually rests on.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Europe/Zurich"
    # `chore` prefix makes the PR title (and thus the squash commit on main)
    # follow the repo's `<type>: <summary>` convention, so the preflight
    # title check needs no Dependabot exemption.
    commit-message:
      prefix: "chore"
    # Split by update type rather than one batch for everything: auto-merge is decided per PR
    # from its update type, and a batch containing a single major resolves to major — so one
    # major bump parks every minor and patch alongside it until a human gets to them.
    groups:
      actions:  # minor/patch batch: auto-merges once checks pass
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:  # majors batch separately and wait for review
        patterns: ["*"]
        update-types: ["major"]
    # Matches the 14 days the uv entry uses, for consistency rather than for the same reason:
    # PyPI's file-addition window has no counterpart here, since action bumps resolve to a commit
    # SHA. What the wait buys is the weaker but still useful property that a compromised or broken
    # release has time to surface upstream before a bump can auto-merge.
    cooldown:
      default-days: 14  # covers every semver level; no per-level override needed

  - package-ecosystem: "uv"
    # Refreshes uv.lock for the runtime + dev/lint/type tooling the lockfile
    # deliberately pins — those rot without automated updates.
    directory: "/"
    # Tuesday: see the day/time rationale on the github-actions entry above.
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Zurich"
    commit-message:
      prefix: "chore"
    # Never touch pyproject.toml requirement ranges: the per-Python floors are
    # a deliberate compatibility contract (earliest release shipping a wheel),
    # not something to ratchet up to the latest version.
    versioning-strategy: lockfile-only
    ignore:
      # Comparison-harness dependencies. They move when benchmarks are regenerated, not weekly —
      # ignored here, not frozen: a campaign still upgrades them by hand. Several also cap what
      # the rest of the lockfile can reach, so a weekly bump attempt fails the whole run.
      - dependency-name: "matplotlib"
      - dependency-name: "fpsample"
      - dependency-name: "skmatter"
      - dependency-name: "rdkit"
      - dependency-name: "apricot-select"
      - dependency-name: "kmedoids"
      - dependency-name: "networkx"
      - dependency-name: "scikit-learn"
      - dependency-name: "ortools"
      - dependency-name: "pyscipopt"
      - dependency-name: "qc-selector"
      # numpy 2.5 dropped Python 3.11, which this package still supports, so every release from
      # 2.5 on is unresolvable here. Patches to 2.4.x still come through. Delete this entry when
      # the 3.11 floor goes.
      - dependency-name: "numpy"
        versions: [">=2.5"]
    # Split by update type, as on the github-actions entry above and for the same reason. Here
    # it also lets the longer major cooldown below do its job: a mixed batch would hold the
    # minor and patch bumps back for the major's cooldown too.
    groups:
      python:  # minor/patch batch: auto-merges once checks pass
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:  # majors batch separately and wait for review
        patterns: ["*"]
        update-types: ["major"]
    # 14 days, chosen to match PyPI's own window rather than as a general soak: a PyPI release
    # rejects new files once it is 14 days old, a rule aimed squarely at poisoning an existing
    # release with compromised publishing credentials. Resolving only past that point means the
    # file set installed is the one the release is stuck with — a shorter wait leaves the loophole
    # of picking up a file added days after the release looked settled.
    #   https://blog.pypi.org/posts/2026-07-22-releases-now-reject-new-files-after-14-days/
    # That announcement is the reference because there is no other: the rule has no page under
    # docs.pypi.org, its formal semantics being left to PEP 694. Re-check it before changing this
    # number, since the two are meant to stay equal.
    cooldown:
      default-days: 14  # covers every semver level; no per-level override needed

  - package-ecosystem: "pre-commit"
    # Bumps the pinned `rev` of each hook in .pre-commit-config.yaml; the hook tooling
    # (ruff, actionlint, zizmor, codespell, ...) rots without these bumps.
    directory: "/"
    # Wednesday: a third distinct day, for the collision reason spelled out on the
    # github-actions entry — auto-merged bumps that fire in the same minute strand each other
    # behind an out-of-date main.
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "01:00"
      timezone: "Europe/Zurich"
    commit-message:
      prefix: "chore"
    # Split by update type, as on the entries above and for the same reason: a batch holding a
    # single major resolves to major and would park every minor/patch bump behind review.
    groups:
      pre-commit:  # minor/patch batch: auto-merges once checks pass
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pre-commit-major:  # majors batch separately and wait for review
        patterns: ["*"]
        update-types: ["major"]
    # 14 days, matching the entries above. A hook `rev` resolves to a git ref, so (as on the
    # github-actions entry) the wait is soak time for a compromised or broken release to surface
    # upstream before a bump can auto-merge. Not subsumed by the weekly cadence: the schedule
    # sets how often Dependabot looks, the cooldown how old a release must be to be eligible, so
    # a release that landed in the days before a run still waits rather than being taken at once.
    cooldown:
      default-days: 14  # covers every semver level; no per-level override needed
