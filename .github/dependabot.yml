version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" scans .github/workflows; each composite action under .github/actions
    # needs its own entry for the `uses:` pins inside it to be tracked.
    directories:
      - "/"
      - "/.github/actions/unit_test"
      - "/.github/actions/pre_commit"
    # Deliberately a different day from the uv entry below: both ecosystems used to
    # fire in the same minute, and since patch/minor bumps auto-merge, whichever
    # landed first left its sibling behind main — unmergeable under the
    # up-to-date-branch rule until someone updated the branch by hand.
    # Local overnight time (Dependabot applies the timezone incl. DST), so a PR
    # opens and merges while nothing else is being pushed to main. Treat it as a
    # preference, not a guarantee: observed firing times have varied by hours and
    # have landed off the nominal day, so the day separation above is what the
    # collision fix actually rests on.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Europe/Zurich"
    # `chore` prefix makes the PR title (and thus the squash commit on main)
    # follow the repo's `<type>: <summary>` convention, so the preflight
    # title check needs no Dependabot exemption.
    commit-message:
      prefix: "chore"
    # Split by update type rather than one batch for everything: auto-merge is decided per PR
    # from its update type, and a batch containing a single major resolves to major — so one
    # major bump parks every minor and patch alongside it until a human gets to them.
    groups:
      actions:  # minor/patch batch: auto-merges once checks pass
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:  # majors batch separately and wait for review
        patterns: ["*"]
        update-types: ["major"]
    # Let releases age before PRs open: auto-merged patch/minor bumps then sit
    # long enough for upstream compromises to surface before they can land.
    # (semver-specific cooldowns are not supported for github-actions.)
    cooldown:
      default-days: 7  # zizmor's dependabot-cooldown floor; ~no-op at weekly cadence anyway

  - package-ecosystem: "uv"
    # Refreshes uv.lock for the runtime + dev/lint/type tooling the lockfile
    # deliberately pins — those rot without automated updates.
    directory: "/"
    # Tuesday: see the day/time rationale on the github-actions entry above.
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Zurich"
    commit-message:
      prefix: "chore"
    # Never touch pyproject.toml requirement ranges: the per-Python floors are
    # a deliberate compatibility contract (earliest release shipping a wheel),
    # not something to ratchet up to the latest version.
    versioning-strategy: lockfile-only
    # Split by update type, as on the github-actions entry above and for the same reason. Here
    # it also lets the longer major cooldown below do its job: a mixed batch would hold the
    # minor and patch bumps back for the major's cooldown too.
    groups:
      python:  # minor/patch batch: auto-merges once checks pass
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:  # majors batch separately and wait for review
        patterns: ["*"]
        update-types: ["major"]
    cooldown:
      default-days: 7  # zizmor's dependabot-cooldown floor; ~no-op at weekly cadence anyway
      semver-major-days: 14
