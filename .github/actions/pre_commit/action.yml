name: Pre-commit
author: Bert Pluymers
description: Set up uv and run the full pre-commit hook suite over all files (mirrors `make lint`).

runs:
    using: composite
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        shell: bash
        run: uv sync --no-default-groups --group lint

      - name: Run pre-commit
        shell: bash
        run: uv run --no-default-groups --group lint pre-commit run --all-files --show-diff-on-failure
