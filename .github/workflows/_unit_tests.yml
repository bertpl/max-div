name: Unit tests (full matrix)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: py${{ matrix.python }} / ${{ matrix.resolution }} / jit-${{ matrix.jit }} / extras-${{ matrix.extras }}
    # ARM, which runs this suite about twice as fast as the x64 runner for the same work.
    # Standardized rather than mixed: the matrix does not set out to test architectures, so no
    # job has a reason to run on x64.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-only: pure Python + numpy/scipy/numba, no OS-specific code paths, so one
        # OS exercises everything. Strategic combos cover every axis (every supported Python,
        # every resolution), not their full product. numba is a mandatory dependency; the jit
        # axis distinguishes compiled (representative) from
        # interpreted execution — coverage comes from the jit-off jobs, since numba
        # only yields line coverage with the JIT disabled. The extras axis distinguishes
        # a full install from the plain install a user gets: on the extras-off jobs the
        # tests that need an extra are skipped and the tests of what the package does
        # without one are run. The two axes do not interact, so the extras-off jobs run
        # compiled; the guard's missing-extra branch is covered on every job by a test
        # that patches the availability check.
        include:
          - { python: "3.12", resolution: highest,       jit: "on",  extras: "true"  }
          - { python: "3.13", resolution: highest,       jit: "on",  extras: "true"  }
          - { python: "3.14", resolution: highest,       jit: "on",  extras: "true"  }
          - { python: "3.15", resolution: highest,       jit: "on",  extras: "true"  }
          - { python: "3.12", resolution: lowest-direct, jit: "on",  extras: "true"  }
          - { python: "3.14", resolution: lowest-direct, jit: "on",  extras: "true"  }
          - { python: "3.15", resolution: lowest-direct, jit: "on",  extras: "true"  }
          # This job installs the versions in uv.lock, on the Python version recorded in the JIT
          # golden master (the expected output of seeded, JIT-compiled solves, which
          # tests/_core/solver/test_golden_master.py checks), so `make test` fails the JIT golden
          # master test on a version mismatch instead of skipping it.
          #
          # The other jit-on jobs skip that test whenever their Python or numba version differs
          # from the recorded one: they run another Python, or install the newest or the minimum
          # versions.
          - { python: "3.14", resolution: locked,        jit: "on",  extras: "true"  }
          - { python: "3.12", resolution: highest,       jit: "off", extras: "true"  }  # coverage job
          - { python: "3.14", resolution: highest,       jit: "off", extras: "true"  }  # coverage job
          - { python: "3.12", resolution: highest,       jit: "on",  extras: "false" }  # plain install
          - { python: "3.14", resolution: highest,       jit: "on",  extras: "false" }  # plain install
          # This job runs the free-threaded build with `highest` only, deliberately: the minimum
          # numba version for 3.14
          # is 0.63, which predates numba's free-threaded wheels (first shipped in 0.65), and no
          # PEP 508 marker can raise that minimum for free-threaded builds alone — so a
          # lowest-direct job would try to source-build a numba with no usable wheel. Do not
          # "complete the matrix" by adding one. The quoted "3.14t" is what makes uv resolve the
          # free-threaded interpreter, not the GIL one.
          #
          # There is no 3.15t job: as of numba 0.68, numba ships no free-threaded wheel for 3.15.
          - { python: "3.14t", resolution: highest,      jit: "on",  extras: "true"  }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/unit_test
        with:
          python_version: ${{ matrix.python }}
          dependency_resolution: ${{ matrix.resolution }}
          jit: ${{ matrix.jit }}
          all_extras: ${{ matrix.extras }}
          # the jit-off jobs upload their data; the coverage job combines it and checks the
          # minimum coverage
          coverage: ${{ matrix.jit == 'off' && 'true' || 'false' }}

  coverage:
    name: coverage
    # Cumulative check: combine the jit-off jobs' coverage data into one report before checking
    # the minimum coverage, so version-divergent code paths don't read as uncovered.
    needs: [core]
    # always() so a cancelled/failed combo makes this job FAIL explicitly rather than
    # skip — GitHub doesn't reliably propagate a cancelled job through needs.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix combo to have succeeded
        if: needs.core.result != 'success'
        run: |
          echo "::error::test matrix did not fully succeed (core result: ${{ needs.core.result }})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Download coverage data from all matrix combos
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report (fails below the minimum coverage in [tool.coverage.report])
        run: |
          uv run --group dev coverage combine
          uv run --group dev coverage report
      - name: Compute release metrics (coverage % + test count)
        run: uv run --group dev python .github/scripts/ci_compute_metrics.py metrics.json
      - name: Upload release metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metrics
          path: metrics.json
