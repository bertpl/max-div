name: Unit tests (full matrix)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The entries of the test matrix come from scripts/ci_test_matrix.py, which builds them from the
  # [tool.ci-test-matrix] table in pyproject.toml; the table and its comments say which jobs run
  # and why.
  build-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.entries.outputs.entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build the matrix entries
        id: entries
        # The script's output goes into a variable first: inside echo "entries=$(...)", a failing
        # script would not fail this step.
        run: |
          entries="$(uv run --no-project python scripts/ci_test_matrix.py matrix)"
          echo "entries=$entries" >> "$GITHUB_OUTPUT"

  core:
    name: py${{ matrix.python }} / ${{ matrix.resolution }} / jit-${{ matrix.jit }} / extras-${{ matrix.extras }}
    needs: [build-test-matrix]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-test-matrix.outputs.entries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/unit_test
        with:
          python_version: ${{ matrix.python }}
          dependency_resolution: ${{ matrix.resolution }}
          jit: ${{ matrix.jit }}
          all_extras: ${{ matrix.extras }}
          coverage: ${{ matrix.coverage }}

  coverage:
    name: coverage
    # Cumulative check: combine the jit-off jobs' coverage data into one report before checking
    # the minimum coverage, so code paths that run only on some Python or dependency versions
    # don't read as uncovered.
    needs: [core]
    # always() so a cancelled/failed matrix job makes the coverage job FAIL explicitly, not
    # skip — GitHub doesn't reliably propagate a cancelled matrix job through needs.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix combo to have succeeded
        if: needs.core.result != 'success'
        run: |
          echo "::error::test matrix did not fully succeed (core result: ${{ needs.core.result }})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Download coverage data from all matrix combos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report (fails below the minimum coverage in [tool.coverage.report])
        run: |
          uv run --group dev coverage combine
          uv run --group dev coverage report
      - name: Compute release metrics (coverage % + test count)
        run: uv run --group dev python .github/scripts/ci_compute_metrics.py metrics.json
      - name: Upload release metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metrics
          path: metrics.json
