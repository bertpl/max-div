name: Release tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# no concurrency guard: a release run must never be auto-cancelled

jobs:
  validate-tag-version:
    name: Validate tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false  # release path never restores from a poisonable cache
      - name: Compare tag to pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(uv version --short)"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::tag '$TAG' does not match package version 'v$PKG_VERSION'"
            exit 1
          fi

  test:
    needs: validate-tag-version
    uses: ./.github/workflows/_unit_tests.yml

  # Build + blind-install gate: the same package check PRs run behind ci-gate.
  # Publishing below reuses the exact artifact this job built and tested.
  package-check:
    needs: validate-tag-version
    uses: ./.github/workflows/_package_check.yml

  publish-to-prod:
    name: Publish "${{ github.ref_name }}" to PyPI
    needs: [test, package-check]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      # mandatory for PyPI Trusted Publishing (OIDC); also signs the keyless provenance
      id-token: write
      # store SLSA build provenance for the wheel + sdist
      attestations: write
    steps:
      - name: Download the tested distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # SLSA build provenance over the exact artifacts we publish. Complements
      # (does not replace) the PEP 740 attestations gh-action-pypi-publish emits
      # on PyPI: this one is verifiable from the GitHub side via
      # `gh attestation verify <artifact> --repo bertpl/max-div`, and its
      # bundle is attached to the GitHub Release by the github-release job below.
      - name: Attest SLSA build provenance for the wheel + sdist
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # List the artifact patterns explicitly rather than `dist/*`, so stray
          # non-distribution files in the artifact can never be swept into the
          # provenance as spurious subjects.
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      # Extension is `.intoto.jsonl`, not `.sigstore.jsonl`: OpenSSF Scorecard's
      # Signed-Releases check credits provenance purely by this filename suffix
      # (it never opens the file). Do not "correct" it — the suffix is what scores.
      - name: Stage the provenance bundle under a stable name
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}  # via env, not inline — keep it out of the run: template
        run: cp "$BUNDLE_PATH" provenance.intoto.jsonl
      - name: Hand the provenance bundle to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-bundle
          path: provenance.intoto.jsonl
          if-no-files-found: error

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/

  github-release:
    needs: publish-to-prod
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release (implies the read the checkout needs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false  # release path never restores from a poisonable cache
      - name: Download the provenance bundle from the publish job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-bundle
      - name: Extract release notes from CHANGELOG.md
        run: uv run python scripts/extract_changelog.py > release_notes.md
      - name: Create GitHub Release with the provenance bundle attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            provenance.intoto.jsonl
