name: Release tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# no concurrency guard: a release run must never be auto-cancelled

jobs:
  validate-tag-version:
    name: Validate tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false  # release path never restores from a poisonable cache
      - name: Compare tag to pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(uv version --short)"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::tag '$TAG' does not match package version 'v$PKG_VERSION'"
            exit 1
          fi

  test:
    needs: validate-tag-version
    uses: ./.github/workflows/_unit_tests.yml

  # Build + blind-install gate: the same package check PRs run behind ci-gate.
  # Publishing below reuses the exact artifact this job built and tested.
  package-check:
    needs: validate-tag-version
    uses: ./.github/workflows/_package_check.yml

  publish-to-prod:
    name: Publish "${{ github.ref_name }}" to PyPI
    needs: [test, package-check]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      # mandatory for PyPI Trusted Publishing (OIDC)
      id-token: write
    steps:
      - name: Download the tested distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
