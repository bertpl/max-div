# Reusable package-integrity check: build the distribution once, verify the
# wheel statically, then blind-install it into a bare environment and run the
# test suite against it. Guards the packaging layer (empty wheel, missing
# modules, broken entry point) that editable-install test runs can never see.
# Called from the PR pipeline (behind ci-gate) and from the release pipeline
# (before publish, which reuses the exact artifact tested here).
name: Package check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false  # this job's output is the published artifact; never restore from a poisonable cache

      - name: Build sdist + wheel
        run: uv build

      # Static gate: catches structurally broken wheels (empty, missing the
      # declared import package, ...) before the install job spins up.
      - name: Check wheel contents
        run: uv run --frozen --no-default-groups --group package check-wheel-contents dist/*.whl

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install-test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Blind environment: test deps come lockfile-pinned from the test group
      # (--only-group keeps the project and its runtime dependencies out), and
      # max_div can only come from the built wheel — never an editable/source install.
      - name: Install the built wheel into a bare environment
        run: |
          uv export --frozen --no-emit-project --only-group test -o requirements.txt
          uv venv blind-venv
          uv pip install --python blind-venv/bin/python -r requirements.txt
          WHEEL=(dist/*.whl)
          uv pip install --python blind-venv/bin/python "max-div @ file://$PWD/${WHEEL[0]}"

      - name: Assert the environment is blind
        run: |
          blind-venv/bin/python -c "
          import max_div
          path = max_div.__file__
          assert 'site-packages' in path, f'max_div resolves outside site-packages: {path}'
          print(f'OK: max_div imported from {path}')
          "

      - name: Run the test suite against the installed wheel
        run: blind-venv/bin/python -m pytest tests/

      - name: Smoke-test the CLI entry point
        run: blind-venv/bin/max-div --help
