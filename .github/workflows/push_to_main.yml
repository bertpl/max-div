name: Push to Main

on:
  push:
    branches: ["main"]
  # `make release` (scripts/release/) needs a successful run of this workflow for the HEAD of main.
  # A Dependabot auto-merge pushes its merge commit with GITHUB_TOKEN, and commits pushed with
  # GITHUB_TOKEN start no workflow runs, so this workflow is started by hand for the merge commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_unit_tests.yml
