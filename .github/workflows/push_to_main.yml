name: Push to Main

on:
  push:
    branches: ["main"]
  # Dependabot auto-merge pushes its merge commit with GITHUB_TOKEN, and pushes made with
  # GITHUB_TOKEN start no workflow runs, so this workflow is started by hand for that commit;
  # scripts/release.py needs a successful run of this workflow for the HEAD of main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_unit_tests.yml
