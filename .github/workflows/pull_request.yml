name: Pull Request

on:
  pull_request:
    # No base-branch filter: stacked PRs (base = another feature branch) get the
    # same pipeline as main-based ones. `edited` re-runs the PR-title check on
    # title edits.
    types: [opened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap PR-metadata gates bundled into one job, so the expensive jobs fail
  # fast behind a single check.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        # PR author, not github.actor — a human re-running checks on a Dependabot
        # PR must not un-exempt it (Dependabot branches don't follow the convention)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs|refactor|test)/[a-z0-9-]+$ ]]; then
            echo "::error::Branch name '$BRANCH' does not match ^(feat|fix|chore|docs|refactor|test)/[a-z0-9-]+\$"
            exit 1
          fi

      # The repo squash-merges, so the PR title becomes the commit subject on
      # main — the CI complement to the local commit-msg hook. Dependabot PRs
      # pass too: dependabot.yml sets the `chore` commit-message prefix.
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|test):[[:space:]].+ ]]; then
            echo "::error::PR title '$PR_TITLE' does not match '<type>: <summary>' (type in feat|fix|chore|docs|refactor|test)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changelog updated for feat/ and fix/ branches
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feat|fix)/ ]]; then
            echo "Branch '$BRANCH' is not feat/ or fix/; changelog entry not required."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md was modified — OK."
            exit 0
          fi
          echo "::error::feat/ and fix/ PRs must update CHANGELOG.md."
          exit 1

  pre-commit:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pre_commit

  test:
    needs: [preflight]
    uses: ./.github/workflows/_unit_tests.yml

  # Comparison-benchmark harness tests: single leg (py3.14, numba on) with the
  # `benchmarks` dependency group — deliberately outside the package test matrix.
  # Network-dependent tests (MDPLIB fetch, code-FDM fetch) skip on fetch failure,
  # so upstream availability can never block a merge.
  test-benchmarks-harness:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # The MDPLIB loader keeps a downloaded archive only after its pinned SHA-256 matched, so a
      # cache hit is always an intact archive; the key carries the pinned digest's prefix so a
      # re-pinned archive misses. The cache spares the job the download from the maintainers'
      # site, whose transfers sometimes arrive truncated.
      - name: Cache the MDPLIB archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/benchmarks/mdplib/mmdp_instances.zip
          key: mdplib-mmdp-32c437de
      - name: Run harness tests
        run: make test-benchmarks

  # Package-integrity gate: build once, verify the wheel statically, then
  # blind-install the artifact and test against it — catches packaging holes
  # (empty wheel, missing modules) that editable-install runs cannot see.
  package:
    needs: [preflight]
    uses: ./.github/workflows/_package_check.yml

  # Synchronous dependency-CVE gate: audits the locked runtime dependencies
  # against the advisory DB at PR time — the blocking complement to the async,
  # repo-level Dependabot alerts. Hard-fails on any advisory; accepted ones go
  # in `ignore-vulns` below with a justification.
  pip-audit:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Export the locked runtime dependencies
        run: uv export --frozen --no-emit-project --no-dev --no-hashes --format requirements-txt -o requirements.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          no-deps: "true"  # requirements.txt is already the full pinned closure
          # Accepted/unfixable advisories go here (one id per line) with a reason:
          # ignore-vulns: |
          #   GHSA-xxxx-xxxx-xxxx  # why accepted

  # Docs must build cleanly at PR time. A broken nav entry, dead cross-link, or stale mkdocstrings
  # reference is only a warning, which a non-strict build publishes silently — Read the Docs then
  # serves the last good build and never signals GitHub. The strict `make docs` fails this check on
  # any such warning.
  docs:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build docs (strict)
        run: make docs

  ci-gate:
    name: CI gate
    # The single stable required check on main: branch protection requires only
    # this, so the job set can change without re-touching repo settings.
    # `always()` is load-bearing — without it the gate is skipped when an
    # upstream job fails, and GitHub treats a skipped required check as passing.
    if: always()
    needs: [preflight, pre-commit, test, test-benchmarks-harness, package, pip-audit, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more required jobs failed."
          exit 1
